# ==============================================================================
# Boson DHT Node Configuration Template
# ==============================================================================
# This file defines the operational parameters for a Boson DHT node.
#
# Configuration Lookup Order (if no explicit path is provided):
#
# Unix-like (Linux/macOS):
#   1. ./node.yaml
#   2. ~/.config/boson/node.yaml
#   3. /usr/local/etc/boson/node.yaml
#   4. /etc/boson/node.yaml
#
# Windows:
#   1. .\node.yaml
#   2. %APPDATA%\boson\node.yaml
#   3. %ProgramData%\boson\node.yaml
# ==============================================================================

# IPv4 address to bind for DHT protocol communication.
#
# This is an address of one of this host's own network interfaces: it is what the
# node listens on, not necessarily what the Internet reaches it by. The two are
# the same on a server with a directly assigned public address, and different on a
# cloud server with an elastic or floating address - there the public address is
# mapped to the machine by the provider's network, is on no local interface, and
# binding it fails with "Cannot assign requested address".
#
# IMPORTANT: The node MUST be reachable from the public internet, whether directly
# on this address or through such a mapping.
#
# Using 0.0.0.0 (wildcard) is generally discouraged as the node needs a 
# deterministic external IP to advertise its presence to peers.
# Only one of host4 or interface4 can be configured.
host4: LOCAL_IPV4_ADDRESS

# Network interface to bind for IPv4 DHT protocol communication, instead of a
# fixed host4 address. The node uses the first available unicast IPv4 address
# on this interface, re-resolved on every restart - useful when the machine's
# address changes (e.g. a laptop moving between networks).
# interface4: eth0

# IPv6 address to bind. 
# Uncomment and set to a globally reachable IPv6 address to enable IPv6 support.
# Only one of host6 or interface6 can be configured.
# host6: 2001:db8:85a3::8a2e:370:7334

# Network interface to bind for IPv6 DHT protocol communication, instead of a
# fixed host6 address. Same re-resolution behavior as interface4.
# interface6: eth0

# Port number for DHT UDP traffic.
# The default port is 39001. Ensure this port is open in your firewall (UDP).
port: 39001

# Node private key
# This key defines your node's long-term identity on the network. 
# If lost, your node's reputation and stable ID will be lost.
#
# Supported formats:
#   - Base58 string (standard format)
#   - Hex string (double-quoted string, must start with "0x")
#
# CAUTION: Keep this key secret. Never share it.
privateKey: NODE_PRIVATE_KEY

# Root directory for persistent data.
# Stores routing tables, caches, and database files.
# If omitted, defaults to 'boson/node' under the per-user data directory
# (~/.local/share on Unix-like systems, %LOCALAPPDATA% on Windows).
#
# Recommended locations for user deployments:
#   - Unix-like: ~/.local/share/boson/node
#   - Windows:   %LOCALAPPDATA%\boson\node
#
# Recommended locations for system-wide deployments:
#   - Unix-like: /var/lib/boson/node
#   - Windows:   %ProgramData%\boson\node
dataDir: ~/.local/share/boson/node

# Persistence Layer Configuration.
#
# Boson supports multiple database backends:
#   - SQLite: Ideal for lightweight or personal nodes. (e.g., jdbc:sqlite:node.db)
#   - PostgreSQL: Recommended for high-performance or super nodes.
#
database:
  # Database connection URI.
  uri: jdbc:sqlite:node.db

  # Connection pool size. 0 uses the default for the specific driver.
  # poolSize: 0

  # Database schema name (PostgreSQL only).
  # schema: kademlia

# Kademlia parameters.
#
# Commented out, so this node runs the built-in defaults - shown after each setting below. The values
# here illustrate a raised set rather than recommend one: what is right depends on what the node
# does, and the packaged bootstrap and super node configurations each ship their own.
# kademlia:
#   # Standard Kademlia parameter: concurrency parameter. Default: 3
#   alpha: 4
#   # Standard Kademlia parameter: bucket size. Default: 16
#   k: 32
#   # Additional parameter for k. The number of replacements. Default: 8
#   replacements: 16
#   # Maximum number of concurrently running DHT tasks.
#   # If too many tasks are started at once, the system will queue the rest.
#   # Default: 32
#   concurrentTasks: 256

# Initial entry points to the DHT network.
# These nodes are contacted during startup to discover other peers.
#
# The entries below are format examples, not reachable nodes: the addresses are from the
# documentation ranges reserved by RFC 5737. Replace the ids and addresses with real ones
# before uncommenting.
#
# Format: [ NodeID (Base58), IPAddress, Port ] or
#         [ NodeID (Base58), IPv4Address, Port4, IPv6Address, Port6 ]
# bootstraps:
#   - - 2dLbPsaySh9EGWwpgreYiLEPG3NDhaojj7DBBfSsRr6k
#     - 203.0.113.5
#     - 39001
#   - - 7jFV8w7eivjGEpaDu4V38EZ16CDhn4JutEdtGBWC67rF
#     - 198.51.100.8
#     - 39001

security:
  # Security: Throttles high-frequency requests from single peers to mitigate DoS.
  # Default: true
  spamThrottling: true

  # Security: Identifies and isolates peers exhibiting malicious or abnormal behaviors.
  # Default: true
  suspiciousNodeDetector: true

  # Development: Allows participation in the DHT using local/private IPs (RFC1918).
  # WARNING: Setting this to 'true' in a public or production deployment may lead to routing issues.
  # Default: false
  developerMode: false
